# Evaluation Configuration

systems:
  - name: baseline
    description: "Base Qwen2.5-3B-Instruct without RAG"
    rag: false
    graph: false
    finetuned: false

  - name: vector_rag
    description: "Qwen2.5-3B + vector-only RAG"
    rag: true
    graph: false
    finetuned: false

  - name: graphrag
    description: "Qwen2.5-3B + hybrid GraphRAG"
    rag: true
    graph: true
    finetuned: false

  - name: finetuned_graphrag
    description: "Fine-tuned Qwen2.5-3B + hybrid GraphRAG + evidence validator"
    rag: true
    graph: true
    finetuned: true

metrics:
  - answer_accuracy
  - retrieval_recall_at_5
  - retrieval_recall_at_10
  - retrieval_mrr
  - citation_precision
  - citation_recall
  - unsupported_claim_rate
  - abstention_accuracy
  - temporal_accuracy

question_categories:
  - constitutional
  - criminal
  - civil
  - contract
  - technology_privacy
  - consumer
  - procedural
  - case_law_interpretation
  - amendment_temporal
  - citation_verification
  - adversarial_no_answer

output_dir: "./data/evaluation/results"
min_questions: 100
