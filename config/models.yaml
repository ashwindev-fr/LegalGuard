# Model Configuration

embedding:
  model: "BAAI/bge-m3"
  dimension: 1024
  batch_size: 32
  device: "auto"  # auto-detect CPU/GPU

reranker:
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 8

llm:
  provider: "ollama"
  model: "qwen2.5:3b"
  temperature: 0.1
  max_tokens: 2048
  top_p: 0.9
  ollama_base_url: "http://localhost:11434"
